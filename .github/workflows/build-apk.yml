name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create React App & Inject Code
        run: |
          npm create vite@latest my-app -- --template react
          cd my-app
          npm install
          npm install lucide-react @capacitor/core @capacitor/android
          npm install -D @capacitor/cli tailwindcss postcss autoprefixer
          npx cap init "InterviewAce" "com.interviewace.app" --web-dir dist
          npm run build
          npx cap add android
          npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build APK with Gradle
        run: |
          cd my-app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InterviewAce-APK
          path: my-app/android/app/build/outputs/apk/debug/app-debug.apk
          
